import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    rootProject.tasks.register('securityInventory') {
        doLast {
            def packages = [:]
            def scopes = []
            def errors = []
            rootProject.allprojects.each { project ->
                def configs = []
                project.configurations.findAll { it.canBeResolved }.each { configs << [kind: 'project', config: it] }
                project.buildscript.configurations.findAll { it.canBeResolved }.each { configs << [kind: 'buildscript', config: it] }
                configs.each { item ->
                    def label = "${project.path}:${item.kind}:${item.config.name}"
                    try {
                        def result = item.config.incoming.resolutionResult
                        result.allDependencies.findAll { it instanceof UnresolvedDependencyResult }.each {
                            errors << [scope: label, error: it.failure.message]
                        }
                        result.allComponents.each { component ->
                            if (component.id instanceof ModuleComponentIdentifier) {
                                def id = component.id
                                def key = "${id.group}:${id.module}:${id.version}"
                                def entry = packages.computeIfAbsent(key) { [name: "${id.group}:${id.module}", version: id.version, scopes: []] }
                                if (!entry.scopes.contains(label)) entry.scopes << label
                            }
                        }
                        item.config.incoming.artifactView {
                            componentFilter { it instanceof ModuleComponentIdentifier }
                        }.files.files
                        scopes << label
                    } catch (Exception error) {
                        errors << [scope: label, error: error.message]
                    }
                }
            }
            def output = rootProject.layout.buildDirectory.file('security/dependencies.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([gradle: gradle.gradleVersion, packages: packages.values().sort { a, b -> (a.name + ':' + a.version) <=> (b.name + ':' + b.version) }, scopes: scopes, errors: errors]))
            println("Security inventory: ${packages.size()} packages, ${scopes.size()} configurations, ${errors.size()} resolution errors")
            if (errors) throw new GradleException('Incomplete dependency inventory; see build/security/dependencies.json')
        }
    }
}
